name: AI Workflow Check

on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: read

jobs:
  workflow-evidence:
    name: Workflow evidence
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Sync agent skill mirrors
        run: node scripts/sync-agent-skills.mjs

      - name: Run checker self-test
        run: node scripts/ai-workflow-check.selftest.mjs

      - name: Run UX/UI Consistency Pass fixture tests
        run: node scripts/test-uxui-fixtures.mjs

      - name: Run QA Gate fixture tests
        run: node scripts/test-qa-gate-fixtures.mjs

      - name: Prepare workflow check inputs
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
          git diff --name-only "$BASE_SHA" "$HEAD_SHA" > "$RUNNER_TEMP/changed-files.txt"

      - name: Validate AI workflow evidence
        run: |
          node scripts/ai-workflow-check.mjs \
            --repo . \
            --changed-files "$RUNNER_TEMP/changed-files.txt" \
            --pr-body "$RUNNER_TEMP/pr-body.md"

      # M4 — inline-style delta guard (PLAN.md §강제성). Flags NEW inline layout
      # magic numbers under src/ on this PR's diff (tokens/constants exempt;
      # `// ai-check: allow-inline-number <reason>` escape hatch).
      - name: Validate inline-style delta (M4)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          node scripts/ai-workflow-check.mjs --check-inline-styles --base "$BASE_SHA"

      # M1/M3 dev-mode smoke (`--check-smoke`) is intentionally NOT wired here
      # yet: it needs a booted `next dev` + Playwright (chromium) + seeded auth
      # storage-state — a heavier browser CI job (auth-state builder is currently
      # blocked by a rotated service key). Until that job exists, M1/M3 run
      # locally. Follow-up: docs/ai-workflow/runs/2026/06/04/20260604-1247-gate-impl-b.md.
