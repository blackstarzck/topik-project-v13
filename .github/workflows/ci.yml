name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: typecheck / test / lint / build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check active SOT registry
        run: pnpm check:sot-registry

      - name: Check agent skill policy
        run: pnpm check:agent-skill-policy

      - name: Check UI contract diff baseline
        env:
          UI_CONTRACT_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: pnpm check:ui-contract

      - name: Check report-only worktree lifecycle
        run: pnpm check:worktree-lifecycle

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

  lifecycle-windows:
    name: report-only worktree lifecycle / windows
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check report-only worktree lifecycle
        run: pnpm check:worktree-lifecycle
