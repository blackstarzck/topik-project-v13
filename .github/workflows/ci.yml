name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: typecheck / test / lint / build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check active SOT registry
        run: pnpm check:sot-registry

      - name: Check agent skill policy
        run: pnpm check:agent-skill-policy

      - name: Check UI contract diff baseline
        env:
          UI_CONTRACT_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
        shell: bash
        run: |
          set -euo pipefail
          trusted_root=".ui-contract-trusted-runner"
          if git cat-file -e "${UI_CONTRACT_BASE_REF}:scripts/run-trusted-ui-contract.mjs" 2>/dev/null; then
            mkdir -p "${trusted_root}/scripts/lib"
            git show "${UI_CONTRACT_BASE_REF}:scripts/run-trusted-ui-contract.mjs" > "${trusted_root}/scripts/run-trusted-ui-contract.mjs"
            git show "${UI_CONTRACT_BASE_REF}:scripts/check-ui-contract.mjs" > "${trusted_root}/scripts/check-ui-contract.mjs"
            git show "${UI_CONTRACT_BASE_REF}:scripts/lib/ui-contract.mjs" > "${trusted_root}/scripts/lib/ui-contract.mjs"
            git show "${UI_CONTRACT_BASE_REF}:scripts/lib/ui-contract-trust.mjs" > "${trusted_root}/scripts/lib/ui-contract-trust.mjs"
            node "${trusted_root}/scripts/run-trusted-ui-contract.mjs" --base-ref "${UI_CONTRACT_BASE_REF}"
          else
            pnpm check:ui-contract
          fi

      - name: Check report-only worktree lifecycle
        run: pnpm check:worktree-lifecycle

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

  lifecycle-windows:
    name: report-only worktree lifecycle / windows
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check report-only worktree lifecycle
        run: pnpm check:worktree-lifecycle
