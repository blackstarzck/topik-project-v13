<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body style="
      margin: 0;
      background: #f8fafc;
      color: #111827;
      font-family:
        Arial, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
    ">
    <div class="email-page" style="
        box-sizing: border-box;
        margin: 0;
        min-height: 100vh;
        padding: 28px 0;
        background: #f8fafc;
        color: #111827;
        font-family: Arial, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
      ">
        <div class="email-card" data-redirect-to="{{ .RedirectTo }}" style="
          box-sizing: border-box;
          width: 600px;
          max-width: calc(100% - 32px);
          margin: 0 auto;
          overflow: hidden;
          background: #ffffff;
          border: 1px solid #e1e7f0;
          border-radius: 14px;
          box-shadow:
            0 14px 30px rgba(15, 23, 42, 0.08),
            0 2px 8px rgba(15, 23, 42, 0.04);
        ">
            <div class="email-header" style="
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 76px;
            padding: 0 7.2%;
            border-bottom: 1px solid #dbe2eb;
            background: #ffffff;
          ">
                <img class="brand-logo"
                    src="https://fglggyfvzjdsbyckinqa.supabase.co/storage/v1/object/sign/assets/logo/logo.png?token=eyJraWQiOiJzdG9yYWdlLXVybC1zaWduaW5nLWtleV9iZjU0NmJkYy0wNzZjLTRiNDAtYmE5NS03MWRlY2QxNTMzNmEiLCJhbGciOiJIUzI1NiJ9.eyJ1cmwiOiJhc3NldHMvbG9nby9sb2dvLnBuZyIsInNjb3BlIjoiZG93bmxvYWQiLCJpYXQiOjE3ODIxODE2MTAsImV4cCI6MTkzOTg2MTYxMH0.5HXuWjHV8rG0vqOLWsANgSUcM2xEWdFIxAbR0hzCbEU"
                    alt="dotore TOPIK" style="display: block; width: 132px; max-width: 40%; height: auto" />
                <div class="verification-label" style="
              font-size: 12px;
              font-size: clamp(11px, 2vw, 12px);
              line-height: 1.5;
              font-weight: 500;
              color: #667085;
              letter-spacing: 0;
              text-align: right;
              white-space: nowrap;
            ">
                    EMAIL VERIFICATION
                </div>
            </div>

            <div class="email-main" style="
            box-sizing: border-box;
            padding: 40px 7.2% 30px 7.2%;
            background: #ffffff;
          ">
                <h1 class="email-title" style="
              margin: 0;
              font-size: 24px;
              font-size: clamp(28px, 4.3vw, 36px);
              line-height: 1.32;
              font-weight: 800;
              color: #111827;
              letter-spacing: 0;
            ">
                    이메일 주소를 인증하고<br />
                    회원가입을 완료해 주세요
                </h1>

                <p class="email-body-copy" style="
              margin: 18px 0 0 0;
              font-size: 15px;
              font-size: clamp(14px, 1.6vw, 16px);
              line-height: 1.55;
              font-weight: 400;
              color: #374151;
              letter-spacing: 0;
            ">
                    아래 버튼을 눌러 이메일 인증을 완료하면 바로 서비스를 이용할 수 있습니다.
                </p>

                <div class="account-box" style="
              box-sizing: border-box;
              margin: 28px 0 0 0;
              padding: 17px 24px;
              background: #ffffff;
            ">
                    <div style="min-width: 0">
                        <p style="
                  margin: 0;
                  font-size: 14px;
                  line-height: 20px;
                  font-weight: 400;
                  color: #374151;
                  letter-spacing: 0;
                ">
                            계정
                        </p>
                        <p style="
                  margin: 5px 0 0 0;
                  font-size: 17px;
                  line-height: 24px;
                  font-weight: 800;
                  color: #111827;
                  letter-spacing: 0;
                  word-break: break-all;
                ">
                            {{ .Email }}
                        </p>
                    </div>
                </div>

                <a class="email-cta" href="{{ .ConfirmationURL }}" style="
              box-sizing: border-box;
              display: block;
              width: 100%;
              height: 56px;
              margin: 28px auto 0 auto;
              background: #3254F2;
              border-radius: 6px;
              color: #ffffff;
              font-size: 17px;
              font-size: clamp(16px, 2.4vw, 18px);
              line-height: 56px;
              font-weight: 800;
              text-align: center;
              text-decoration: none;
              letter-spacing: 0;
            ">
                    이메일 인증하기
                </a>

                <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="
              margin: 46px auto 0 auto;
              border-collapse: collapse;
              border-spacing: 0;
            ">
                    <tr>
                        <td style="vertical-align: middle">
                            <div class="separator-line" style="
                    height: 1px;
                    overflow: hidden;
                    background: #e2e8f0;
                    font-size: 0;
                    line-height: 1px;
                  "></div>
                        </td>
                        <td style="
                  width: 48px;
                  color: #667085;
                  font-size: 13px;
                  line-height: 20px;
                  font-weight: 500;
                  text-align: center;
                  white-space: nowrap;
                ">
                            또는
                        </td>
                        <td style="vertical-align: middle">
                            <div class="separator-line" style="
                    height: 1px;
                    overflow: hidden;
                    background: #e2e8f0;
                    font-size: 0;
                    line-height: 1px;
                  "></div>
                        </td>
                    </tr>
                </table>

                <a class="fallback-link" href="{{ .ConfirmationURL }}" style="
              box-sizing: border-box;
              display: block;
              width: 100%;
              min-height: 56px;
              margin: 46px auto 0 auto;
              padding: 17px 14px;
              border: 1px solid #C7D0FF;
              border-radius: 5px;
              background: #F7F8FF;
              color: #3254F2;
              font-size: 14px;
              font-size: clamp(14px, 1.8vw, 15px);
              line-height: 20px;
              font-weight: 500;
              text-align: center;
              text-decoration: none;
              word-break: break-all;
              letter-spacing: 0;
            ">
                    {{ .ConfirmationURL }}
                </a>
            </div>

            <div class="email-footer" style="
            box-sizing: border-box;
            min-height: 65px;
            padding: 22px 7.2%;
            background: #ffffff;
          ">
                <p class="email-footer-copy" style="
              margin: 0;
              font-size: 14px;
              font-size: clamp(14px, 2vw, 15px);
              line-height: 1.55;
              font-weight: 400;
              color: #c5c5c5;
              letter-spacing: 0;
            ">
                    본인이 요청하지 않았다면 이 이메일을 무시해 주세요.
                </p>
                <span aria-hidden="true" style="
              display: none;
              overflow: hidden;
              max-width: 0;
              max-height: 0;
              color: transparent;
              font-size: 16px;
              line-height: 0;              
            ">
                    {{ .RedirectTo }}
                </span>
            </div>
        </div>
    </div>
</body>

</html>
